    <!-- Detection theme TRES EN AMONT pour eviter le FOUC.
         Doit s'executer AVANT le rendu du body et avant le style anti-FOUC ci-dessous. -->
    <script>
      (function(){
        try {
          var t = localStorage.getItem('theme-preference');
          if (!t) t = 'light';
          if (window.location.pathname.indexOf('/admin') === 0) t = 'light';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>

    <!-- Title fourni par react-helmet-async via SEOHead component -->
    <title>Contedia</title>

    <!-- Anti-FOUC : couleurs ALIGNEES sur GlobalStyles.ts pour eviter tout flash entre
         le rendu initial et l'application de la CSS bundled. Applique aussi au body
         pour ne pas dependre de l'inheritance. -->
    <style>
      html { background: #FEFCF8; }
      body { margin: 0; background: #FEFCF8; min-height: 100vh; -webkit-text-size-adjust: 100%; color: #2C2C2C; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #141028; color: #F5F0E8; }
      #root { min-height: 100vh; }
    </style>
